<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none" aria-labelledby="title desc" role="img">
  <title id="title">CallMeNow QR sticker on a vehicle</title>
  <desc id="desc">Side view of a car with a QR code sticker on the windshield corner, illustration</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8f4f5"/>
      <stop offset="0.45" stop-color="#d4ecee"/>
      <stop offset="1" stop-color="#c5e3e6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5f5f4"/>
      <stop offset="1" stop-color="#e7e5e4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b8dce0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7eb8c0" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#063a42" flood-opacity="0.18"/>
    </filter>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.15 0 0 0 0 0.18 0 0 0 0.25 0"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <ellipse cx="410" cy="420" rx="320" ry="28" fill="#0d4f5a" opacity="0.12" filter="url(#ground)"/>
  <ellipse cx="400" cy="378" rx="240" ry="14" fill="#063a42" opacity="0.2"/>
  <g filter="url(#soft)">
    <path fill="url(#body)" stroke="#d6d3d1" stroke-width="1.5"
      d="M120 320 L135 268 L210 220 L380 205 L520 212 L620 248 L665 285 L675 318 L672 352 L640 368 L155 368 L125 352 Z"/>
    <path fill="none" stroke="#a8a29e" stroke-width="1.2" opacity="0.6"
      d="M218 222 L395 208 L515 215 L605 252"/>
    <path fill="url(#glass)" stroke="#0d4f5a" stroke-width="2" stroke-opacity="0.35"
      d="M218 222 L395 208 L500 218 L515 215 L505 268 L235 275 Z"/>
    <path fill="#fff" opacity="0.25" d="M240 230 L420 218 L480 225 L460 248 L255 258 Z"/>
    <g transform="translate(248, 228)">
      <rect x="0" y="0" width="56" height="56" rx="6" fill="#fffdf9" stroke="#c45c4a" stroke-width="2"/>
      <rect x="6" y="6" width="14" height="14" fill="#1c1917"/>
      <rect x="36" y="6" width="14" height="14" fill="#1c1917"/>
      <rect x="6" y="36" width="14" height="14" fill="#1c1917"/>
      <rect x="24" y="10" width="4" height="4" fill="#1c1917"/>
      <rect x="32" y="10" width="4" height="4" fill="#1c1917"/>
      <rect x="24" y="18" width="4" height="4" fill="#1c1917"/>
      <rect x="36" y="24" width="4" height="4" fill="#1c1917"/>
      <rect x="44" y="18" width="4" height="4" fill="#1c1917"/>
      <rect x="10" y="24" width="4" height="4" fill="#1c1917"/>
      <rect x="18" y="32" width="4" height="4" fill="#1c1917"/>
      <rect x="28" y="36" width="4" height="4" fill="#1c1917"/>
      <rect x="40" y="40" width="4" height="4" fill="#1c1917"/>
      <rect x="32" y="44" width="4" height="4" fill="#1c1917"/>
