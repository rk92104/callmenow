    <path fill="none" stroke="#a8a29e" stroke-width="1" opacity="0.5" d="M535 290 L538 340"/>
    <circle cx="220" cy="360" r="38" fill="#292524"/>
    <circle cx="220" cy="360" r="22" fill="#57534e"/>
    <circle cx="220" cy="360" r="10" fill="#d6d3d1"/>
    <circle cx="560" cy="360" r="38" fill="#292524"/>
    <circle cx="560" cy="360" r="22" fill="#57534e"/>
    <circle cx="560" cy="360" r="10" fill="#d6d3d1"/>
    <path fill="#e7e5e4" d="M125 340 L155 368 L120 352 Z"/>
    <path fill="#e7e5e4" d="M655 318 L672 352 L640 368 Z"/>
    <ellipse cx="668" cy="305" rx="8" ry="14" fill="#fef3c7" opacity="0.9"/>
